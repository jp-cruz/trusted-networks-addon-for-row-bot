[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trusted-networks-addon-for-row-bot"
version = "0.1.0"
description = "Reference implementation: opt-in trusted-network allowlist for Row-Bot's local-access detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "JP Cruz", email = "jp@legionforge.org" }]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "bandit>=1.7", "mypy>=1.10"]

[tool.setuptools]
py-modules = ["trust"]

[tool.bandit]
exclude_dirs = ["test_trust.py"]
